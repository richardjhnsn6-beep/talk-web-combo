<script>
// ===== VERCEL RICHARD - GROQ API - PUT KEY ON LINE 4 =====

const GROQ_API_KEY = 'gsk_YOUR_NEW_KEY_GOES_HERE'; // <-- PASTE NEW GROQ KEY HERE
const chatDiv = document.getElementById('chat');
const searchBar = document.getElementById('searchBar');
const sendBtn = document.getElementById('sendBtn');

let chatHistory = [
  { role: 'system', content: 'You are AI Richard for Coffee & Tea. Be helpful, warm, a bit playful.' }
];

async function askRichard() {
  const message = searchBar.value.trim();
  if (!message) return;

  // Check for key first
  if (!GROQ_API_KEY || GROQ_API_KEY === '') {
    chatDiv.innerHTML += `<div style="color:#ff4444;"><b>ERROR:</b> Go to console.groq.com → API Keys → Create new key → Paste it on line 4</div>`;
    return;
  }

  chatDiv.innerHTML += `<div style="color:#fff;margin:8px 0;"><b>YOU:</b> ${message}</div>`;
  searchBar.value = '';
  chatHistory.push({ role: 'user', content: message });

  const thinkingDiv = document.createElement('div');
  thinkingDiv.id = 'thinking';
  thinkingDiv.style.cssText = 'color:#666;margin:8px 0;';
  thinkingDiv.innerHTML = '<b>RICHARD:</b> thinking...';
  chatDiv.appendChild(thinkingDiv);
  chatDiv.scrollTop = chatDiv.scrollHeight;

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${GROQ_API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'llama3-8b-8192', // This is a REAL Groq model that exists
        messages: chatHistory,
        temperature: 0.7,
        max_tokens: 500
      })
    });

    const data = await response.json();
    document.getElementById('thinking').remove();

    if (data.error) {
      throw new Error(data.error.message);
    }

    const reply = data.choices[0].message.content;
    chatHistory.push({ role: 'assistant', content: reply });
    chatDiv.innerHTML += `<div style="color:#00ff00;margin:8px 0;"><b>RICHARD:</b> ${reply}</div>`;
    chatDiv.scrollTop = chatDiv.scrollHeight;

  } catch (error) {
    document.getElementById('thinking')?.remove();
    chatDiv.innerHTML += `<div style="color:#ff4444;margin:8px 0;"><b>GROQ ERROR:</b> ${error.message}</div>`;
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }
}

sendBtn.onclick = askRichard;
searchBar.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' &&!e.shiftKey) {
    e.preventDefault();
    askRichard();
  }
});
</script>
