<script>
  // AI Richard — Biblical Scholar Chat Logic
  document.addEventListener('DOMContentLoaded', function() {
    const askButton = document.querySelector('button'); // Finds the "Ask" button
    const inputBox = document.querySelector('input');   // Finds the input box
    const chatBox = document.createElement('div');      // Makes space for answers
    
    // Style the answer area
    chatBox.style.cssText = 'max-width:600px; margin:20px auto; padding:20px; background:#2a1810; border:1px solid #ffd700; border-radius:8px; color:#ffd700; text-align:left; display:none;';
    askButton.parentNode.insertBefore(chatBox, askButton.nextSibling);

    askButton.addEventListener('click', function() {
      const question = inputBox.value.trim();
      if (!question) return;
      
      // Show the box and loading message
      chatBox.style.display = 'block';
      chatBox.innerHTML = '<p><strong>Richard:</strong> Consulting the scrolls...</p>';
      
      // REPLACE THIS WITH YOUR REAL AI ENDPOINT LATER
      // For now it gives a sample response so you can test
      setTimeout(() => {
        chatBox.innerHTML = `
          <p><strong>You asked:</strong> ${question}</p>
          <p><strong>Richard:</strong> Shalom. Based on Second Temple texts and Torah exegesis, this question touches on ${question.length > 30 ? 'a deep tradition' : 'a key concept'}. 
          The Hebrew root suggests careful study of context. For a full answer, I can connect you to my research archive.</p>
          <p style="margin-top:15px; font-size:14px; opacity:0.8;">Note: Connect this to your AI API to get real answers.</p>
        `;
        inputBox.value = ''; // Clear the box
      }, 1500);
    });

    // Let them hit Enter too
    inputBox.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') askButton.click();
    });
  });
</script>
