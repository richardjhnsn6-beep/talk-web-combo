<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Richard</title>
  <style>
    body { 
      font-family: system-ui; 
      margin: 0; 
      background: #0f172a; 
      color: #e2e8f0; 
    }
    #chat { 
      max-width: 900px; 
      margin: 40px auto; 
      padding: 20px; 
    }
    h1 { color: #60a5fa; margin-bottom: 16px; }
    #richard-frame { 
      width: 100%; 
      height: 600px; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      background: #1e293b;
    }
    #controls { 
      margin-top: 20px; 
      display: flex; 
      gap: 12px; 
      flex-wrap: wrap;
      align-items: center;
    }
    #talkBox {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px;
    }
    button { 
      background: #3b82f6; 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 15px;
    }
    button:hover { background: #2563eb; }
    #nowPlaying { 
      color: #94a3b8; 
      font-size: 14px;
      margin-left: auto;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #volume {
      width: 100px;
    }
  </style>
</head>
<body>
  <div id="chat">
    <h1>AI Richard</h1>
    
    <iframe 
      id="richard-frame" 
      src="https://talk-web-combo.preview.emergentagent.com"
      allow="microphone; autoplay"
    ></iframe>
    
    <div id="talkBox">
      <input id="userInput" placeholder="Type a message to AI Richard..." />
      <button id="sendBtn">Send</button>
    </div>

    <div id="controls">
      <button id="playRadio">▶ Play Radio</button>
      <button id="stopRadio">⏹ Stop</button>
      <div class="slider-group">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
      </div>
      <span id="nowPlaying">Ready</span>
    </div>
    
    <audio id="radioPlayer" preload="none"></audio>
  </div>

  <script>
    // Fix 5: Centralize origin so you only change it once
    const EMERGENT_ORIGIN = 'https://talk-web-combo.preview.emergentagent.com';
    
    // Fix 2: Safe postMessage wrapper
    function sendToRichard(payload) {
      const iframe = document.getElementById('richard-frame');
      if (iframe?.contentWindow) {
        iframe.contentWindow.postMessage(payload, EMERGENT_ORIGIN);
      } else {
        console.warn('Richard iframe not ready yet');
      }
    }

    // 1. Bridge: Listen for messages from Emergent iframe
    window.addEventListener('message', (event) => {
      if (event.origin !== EMERGENT_ORIGIN) return;
      
      console.log('Message from Emergent:', event.data);
      
      if (event.data?.type === 'richard-speak') {
        document.getElementById('nowPlaying').textContent = `Richard: ${event.data.text}`;
      }
      if (event.data?.type === 'richard-status') {
        document.getElementById('nowPlaying').textContent = `Status: ${event.data.text}`;
      }
    });

    // Fix 4: Add way to send messages TO Richard
    document.getElementById('sendBtn').onclick = () => {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      
      sendToRichard({ type: 'user-speak', text: text });
      document.getElementById('nowPlaying').textContent = `You: ${text}`;
      input.value = '';
    };

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    // 3. Streaming Radio Station
    const radioPlayer = document.getElementById('radioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const volumeSlider = document.getElementById('volume');
    
    // Replace with your stream URL
    const STREAM_URL = 'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'; // BBC World Service
    // const STREAM_URL = 'https://ice1.somafm.com/groovesalad-256-mp3'; // SomaFM Groove Salad
    
    radioPlayer.volume = volumeSlider.value;
    volumeSlider.oninput = () => {
      radioPlayer.volume = volumeSlider.value;
    };
    
    document.getElementById('playRadio').onclick = () => {
      radioPlayer.src = STREAM_URL;
      radioPlayer.play().then(() => {
        nowPlaying.textContent = '🔊 Radio: Playing';
      }).catch(err => {
        nowPlaying.textContent = 'Error: Click to enable audio first';
        console.error(err);
      });
    };
    
    document.getElementById('stopRadio').onclick = () => {
      radioPlayer.pause();
      radioPlayer.src = '';
      nowPlaying.textContent = '🔇 Radio: Stopped';
    };

    // Fix 1: Tell Emergent we're ready - using correct platform label
    document.getElementById('richard-frame').onload = () => {
      sendToRichard({ type: 'github-pages-ready', page: 'richard.html' });
    };
  </script>
</body>
</html>
