  <div id="radio-container" style="margin-top:30px;padding-top:20px;border-top:2px solid #00ff00;">
    <h3 style="color:#00ff00;margin:0 0 10px 0;">SCHOLAR RADIO 24/7</h3>
    <audio id="scholarRadio" preload="none"></audio>
    <button id="radioToggle" style="padding:12px 20px;background:#00ff00;color:#000;border:none;cursor:pointer;font-weight:bold;font-family:monospace;">▶ STREAM</button>
    <span id="radioStatus" style="margin-left:15px;color:#666;font-family:monospace;">OFFLINE</span>
    <input id="radioVolume" type="range" min="0" max="1" step="0.1" value="0.7" style="width:120px;vertical-align:middle;margin-left:15px;">
  </div>

  <script>
  /* =====================================================
     >>> STREAM URL GOES HERE - DELETE THE PLACEHOLDER <<<
     ===================================================== */
  const STREAM_URL = '###_PUT_YOUR_EMERGENT_STREAM_URL_HERE_###';

  const radio = document.getElementById('scholarRadio');
  const radioToggle = document.getElementById('radioToggle');
  const radioStatus = document.getElementById('radioStatus');
  const radioVolume = document.getElementById('radioVolume');
  let radioPlaying = false;
  let reconnectAttempts = 0;

  radio.addEventListener('ended', ()=>{ if(radioPlaying) restartStream(); });
  radio.addEventListener('error', ()=>{ if(radioPlaying) restartStream(); });
  radio.addEventListener('stalled', ()=>{ if(radioPlaying) restartStream(); });

  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', ()=>toggleRadio());
    navigator.mediaSession.setActionHandler('pause', ()=>toggleRadio());
  }

  function restartStream(){
    reconnectAttempts++;
    radioStatus.innerText = `RECONNECTING ${reconnectAttempts}...`;
    radioStatus.style.color = '#ffd700';
    setTimeout(()=>{
      radio.src = STREAM_URL + '?t=' + Date.now();
      radio.play().catch(()=>{});
    }, 2000);
  }

  function toggleRadio(){
    if(STREAM_URL.includes('###_PUT_YOUR_EMERGENT_STREAM_URL_HERE_###')){
      alert('ERROR: Replace ###_PUT_YOUR_EMERGENT_STREAM_URL_HERE_### with your stream URL');
      return;
    }
    if(!radioPlaying){
      radio.src = STREAM_URL;
      radio.play().then(()=>{
        radioPlaying = true;
        reconnectAttempts = 0;
        radioToggle.innerText = '⏸ LIVE';
        radioStatus.innerText = 'BROADCASTING';
        radioStatus.style.color = '#00ff00';
        localStorage.setItem('scholar_radio','on');
        if('mediaSession' in navigator){
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Scholar Radio',
            artist: 'AI Richard Network',
            album: 'Live 24/7'
          });
        }
      }).catch(e=>{
        radioStatus.innerText = 'STREAM BLOCKED';
        radioStatus.style.color = '#ff0000';
      });
    } else {
      radio.pause();
      radio.src = '';
      radioPlaying = false;
      radioToggle.innerText = '▶ STREAM';
      radioStatus.innerText = 'OFFLINE';
      radioStatus.style.color = '#666';
      localStorage.setItem('scholar_radio','off');
    }
  }

  radioToggle.onclick = toggleRadio;
  radioVolume.oninput = (e)=>{
    radio.volume = e.target.value;
    localStorage.setItem('scholar_volume', e.target.value);
  };

  window.addEventListener('load', ()=>{
    const vol = localStorage.getItem('scholar_volume') || 0.7;
    radio.volume = vol;
    radioVolume.value = vol;
    if(localStorage.getItem('scholar_radio') === 'on'){
      setTimeout(()=>toggleRadio(), 1000);
    }
  });

  setInterval(()=>{
    if(radioPlaying && radio.paused){
      radio.play().catch(()=>{});
    }
  }, 5000);
  </script>
