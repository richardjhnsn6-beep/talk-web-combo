<script>
  // AI Richard — Biblical Scholar Chat Logic v2
  document.addEventListener('DOMContentLoaded', function() {
    const askButton = document.getElementById('askBtn'); 
    const inputBox = document.getElementById('askInput');
    const chatBox = document.createElement('div');  
    
    if (!askButton || !inputBox) return; // Safety check
    
    chatBox.id = 'richardAnswer';
    chatBox.style.cssText = 'max-width:600px; margin:20px auto; padding:20px; background:#2a1810; border:1px solid #ffd700; border-radius:8px; color:#ffd700; text-align:left; display:none; line-height:1.6;';
    askButton.parentNode.insertBefore(chatBox, askButton.nextSibling);

    function askRichard() {
      const question = inputBox.value.trim();
      if (!question) return;
      
      chatBox.style.display = 'block';
      chatBox.innerHTML = '<p><strong>Richard:</strong> Consulting the scrolls...</p>';
      
      // DEMO RESPONSE — REPLACE WITH REAL API LATER
      setTimeout(() => {
        chatBox.innerHTML = `
          <p><strong>You asked:</strong> ${question}</p>
          <p><strong>Richard:</strong> Shalom. In Second Temple Judaism, questions like this often point to the tension between Torah law and lived tradition. 
          The Hebrew term at the root deserves careful parsing. Would you like me to examine the Dead Sea Scrolls fragments related to this?</p>
        `;
        inputBox.value = '';
      }, 1200);
    }

    askButton.addEventListener('click', askRichard);
    inputBox.addEventListener('keypress', e => { if (e.key === 'Enter') askRichard(); });
  });
</script>
