<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Richard</title>
  <style>
    body { 
      font-family: system-ui; 
      margin: 0; 
      background: #0f172a; 
      color: #e2e8f0; 
    }
    #chat { 
      max-width: 900px; 
      margin: 40px auto; 
      padding: 20px; 
    }
    h1 { color: #60a5fa; margin-bottom: 16px; }
    #richard-frame { 
      width: 100%; 
      height: 600px; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      background: #1e293b;
    }
    #talkBox {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px;
    }
    button { 
      background: #3b82f6; 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 15px;
    }
    button:hover { background: #2563eb; }
    #controls { 
      margin-top: 20px; 
      display: flex; 
      gap: 12px; 
      flex-wrap: wrap;
      align-items: center;
    }
    #nowPlaying { 
      color: #94a3b8; 
      font-size: 14px;
      margin-left: auto;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #volume {
      width: 100px;
    }
  </style>
</head>
<body>
  <div id="chat">
    <h1>AI Richard</h1>
    
    <iframe 
      id="richard-frame" 
      src="https://talk-web-combo.preview.emergentagent.com"
      allow="microphone; autoplay"
    ></iframe>
    
    <div id="talkBox">
      <input id="userInput" placeholder="Type a message to AI Richard..." />
      <button id="sendBtn">Send</button>
    </div>

    <div id="controls">
      <button id="playRadio">▶ Play Radio</button>
      <button id="stopRadio">⏹ Stop</button>
      <div class="slider-group">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
      </div>
      <span id="nowPlaying">Ready</span>
    </div>
    
    <audio id="radioPlayer" preload="none"></audio>
  </div>

  <script>
    // ========================
    // CONFIG - PUT KEYS HERE
    // ========================
    const EMERGENT_ORIGIN = 'https://talk-web-combo.preview.emergentagent.com';
    const GROQ_API_KEY = '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'; // <-- GROQ KEY LOCATION
    const STREAM_URL = 'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'; // <-- CHANGE THIS

    // ========================
    // BRIDGE TO EMERGENT
    // ========================
    function sendToRichard(payload) {
      const iframe = document.getElementById('richard-frame');
      if (iframe?.contentWindow) {
        iframe.contentWindow.postMessage(payload, EMERGENT_ORIGIN);
      } else {
        console.warn('Richard iframe not ready yet');
      }
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== EMERGENT_ORIGIN) return;
      
      console.log('Message from Emergent:', event.data);
      
      if (event.data?.type === 'richard-speak') {
        document.getElementById('nowPlaying').textContent = `Richard: ${event.data.text}`;
      }
      if (event.data?.type === 'richard-status') {
        document.getElementById('nowPlaying').textContent = `Status: ${event.data.text}`;
      }
    });

    // ========================
    // GROQ API CALL
    // ========================
    async function askGroq(userText) {
      document.getElementById('nowPlaying').textContent = 'Richard is thinking...';

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GROQ_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.1-70b-versatile',
            messages: [{ role: 'user', content: userText }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        
        const reply = data.choices[0].message.content;
        document.getElementById('nowPlaying').textContent = `Richard: ${reply}`;
        sendToRichard({ type: 'richard-speak', text: reply });
      } catch (err) {
        document.getElementById('nowPlaying').textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    // ========================
    // UI HOOKS
    // ========================
    document.getElementById('sendBtn').onclick = () => {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      askGroq(text);
      input.value = '';
    };

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });
